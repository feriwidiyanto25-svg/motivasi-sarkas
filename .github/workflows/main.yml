name: Test Motivasi Sarkas

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show environment
        run: |
          echo "=== SYSTEM ==="
          uname -a

          echo "=== PYTHON ==="
          python --version

          echo "=== MEMORY ==="
          free -h

          echo "=== CPU ==="
          nproc

          echo "=== FFMPEG ==="
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt tidak ditemukan"
          fi

      - name: Test Python imports
        run: |
          python - <<'PY'
          import moviepy
          import requests
          import gradio

          print("MoviePy : OK")
          print("Requests: OK")
          print("Gradio  : OK")
          PY

      - name: Test completed
        run: echo "GitHub Actions environment siap."

name: Motivasi Sarkas Render

on:
  repository_dispatch:
    types:
      - render_video

jobs:
  render-video:
    runs-on: ubuntu-latest

    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      TOPIK: ${{ github.event.client_payload.topik }}
      API_KEY: ${{ github.event.client_payload.api_key }}
      MODEL_PILIHAN: ${{ github.event.client_payload.model_pilihan }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner resources
        run: |
          echo "===================================="
          echo "       GITHUB RENDER RUNNER"
          echo "===================================="
          echo ""
          echo "CPU:"
          nproc
          echo ""
          echo "MEMORY:"
          free -h
          echo ""
          echo "DISK:"
          df -h .
          echo ""
          echo "PYTHON:"
          python --version

      - name: Protect runtime API key
        shell: bash
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ API Key Gemini tidak diterima."
            exit 1
          fi

          echo "::add-mask::$API_KEY"
          echo "✅ Gemini API Key diterima."

      - name: Validate render parameters
        shell: bash
        run: |
          echo "===================================="
          echo "       RENDER PARAMETERS"
          echo "===================================="

          if [ -z "$TOPIK" ]; then
            echo "❌ Topik kosong."
            exit 1
          fi

          if [ -z "$MODEL_PILIHAN" ]; then
            echo "❌ Model Gemini kosong."
            exit 1
          fi

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "❌ PEXELS_API_KEY belum diset."
            exit 1
          fi

          echo "Topik : $TOPIK"
          echo "Model : $MODEL_PILIHAN"
          echo "Gemini API Key : [MASKED]"
          echo "Pexels API Key : [MASKED]"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            fonts-dejavu

      - name: Configure ImageMagick for MoviePy
        run: |
          echo "===================================="
          echo "   IMAGEMAGICK CONFIGURATION"
          echo "===================================="

          convert --version | head -n 3

          POLICY_FILES=$(find /etc/ImageMagick* -name policy.xml 2>/dev/null || true)

          if [ -z "$POLICY_FILES" ]; then
            echo "❌ policy.xml tidak ditemukan."
            exit 1
          fi

          for POLICY_FILE in $POLICY_FILES; do
            echo "Processing: $POLICY_FILE"

            sudo sed -i \
              's#<policy domain="path" rights="none" pattern="@\*"/>#<!-- MoviePy @ path restriction disabled -->#g' \
              "$POLICY_FILE"
          done

          echo ""
          echo "Remaining path policies:"
          for POLICY_FILE in $POLICY_FILES; do
            grep -n 'domain="path"' "$POLICY_FILE" || true
          done

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            "numpy<2" \
            moviepy==1.0.3 \
            pillow \
            requests \
            python-dotenv \
            google-generativeai

      - name: Verify project imports
        run: |
          python - <<'PY'
          import moviepy
          import PIL
          import requests
          import dotenv
          import google.generativeai

          print("MoviePy :", moviepy.__version__)
          print("Pillow  :", PIL.__version__)
          print("Requests: OK")
          print("Dotenv  : OK")
          print("Gemini  : OK")
          PY

      - name: Render video
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          from ai_generator import generate_naskah
          from video_engine import render_final_video

          topik = os.environ["TOPIK"]
          api_key = os.environ["API_KEY"]
          model_pilihan = os.environ["MODEL_PILIHAN"]

          print("")
          print("====================================")
          print("       MOTIVASI SARKAS RENDER")
          print("====================================")

          print("")
          print("Topik:")
          print(topik)

          print("")
          print("Model:")
          print(model_pilihan)

          print("")
          print("1. Menghubungi Gemini AI...")

          naskah_json = generate_naskah(
              topik,
              api_key=api_key,
              model_name=model_pilihan
          )

          if not isinstance(naskah_json, dict):
              raise RuntimeError(
                  "Response Gemini bukan object JSON."
              )

          if "error" in naskah_json:
              raise RuntimeError(
                  f"Gemini error: {naskah_json['error']}"
              )

          print("")
          print("✅ Naskah berhasil dibuat.")

          print("")
          print("====================================")
          print("NASKAH")
          print("====================================")

          print(
              f"Title     : "
              f"{naskah_json.get('title')}"
          )

          print(
              f"Setup 1   : "
              f"{naskah_json.get('setup_1')}"
          )

          print(
              f"Setup 2   : "
              f"{naskah_json.get('setup_2')}"
          )

          print(
              f"Punchline : "
              f"{naskah_json.get('punchline')}"
          )

          os.makedirs("temp", exist_ok=True)

          result_path = os.path.join(
              "temp",
              "render_result.json"
          )

          with open(
              result_path,
              "w",
              encoding="utf-8"
          ) as result_file:
              json.dump(
                  {
                      "naskah": naskah_json
                  },
                  result_file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("2. Menyerahkan naskah ke Mesin Video...")

          output = render_final_video(
              naskah_json
          )

          if not output:
              raise RuntimeError(
                  "render_final_video() "
                  "mengembalikan None."
              )

          if not os.path.exists(output):
              raise RuntimeError(
                  f"File output tidak ditemukan: {output}"
              )

          file_size = os.path.getsize(output)

          print("")
          print("====================================")
          print("       VIDEO SELESAI DIBUAT")
          print("====================================")

          print(
              f"Output : {output}"
          )

          print(
              f"Size   : "
              f"{file_size / 1024 / 1024:.2f} MB"
          )

          if file_size < 1000:
              raise RuntimeError(
                  "Video output terlalu kecil."
              )

          print("")
          print("✅ RENDER BERHASIL.")

      - name: Show generated files
        run: |
          echo "===================================="
          echo "       HASIL RENDER"
          echo "===================================="

          find temp \
            -maxdepth 1 \
            -type f \
            -printf "%p - %s bytes\n"

          echo ""
          echo "MEMORY:"
          free -h

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: motivasi-sarkas-video-${{ github.run_id }}
          path: |
            temp/final_*.mp4
            temp/render_result.json
          if-no-files-found: error
          retention-days: 1

      - name: Render completed
        run: |
          echo ""
          echo "===================================="
          echo "       JOB SELESAI"

name: Motivasi Sarkas Render

on:
  repository_dispatch:
    types:
      - render_video

jobs:
  render-video:
    runs-on: ubuntu-latest

    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      # Hanya diisi oleh Cloudflare Worker.
      # Railway tetap mengirim payload lama tanpa chat_id.
      CHAT_ID: ${{ github.event.client_payload.chat_id }}

      TOPIK: ${{ github.event.client_payload.topik }}
      API_KEY: ${{ github.event.client_payload.api_key }}
      MODEL_PILIHAN: ${{ github.event.client_payload.model_pilihan }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner resources
        run: |
          echo "===================================="
          echo "       GITHUB RENDER RUNNER"
          echo "===================================="
          echo ""
          echo "CPU:"
          nproc
          echo ""
          echo "MEMORY:"
          free -h
          echo ""
          echo "DISK:"
          df -h .
          echo ""
          echo "PYTHON:"
          python --version

      - name: Protect runtime API key
        shell: bash
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ API Key Gemini tidak diterima."
            exit 1
          fi

          echo "::add-mask::$API_KEY"
          echo "✅ Gemini API Key diterima."

      - name: Validate render parameters
        shell: bash
        run: |
          echo "===================================="
          echo "       RENDER PARAMETERS"
          echo "===================================="

          if [ -z "$TOPIK" ]; then
            echo "❌ Topik kosong."
            exit 1
          fi

          if [ -z "$MODEL_PILIHAN" ]; then
            echo "❌ Model Gemini kosong."
            exit 1
          fi

          if [ -z "$PEXELS_API_KEY" ]; then
            echo "❌ PEXELS_API_KEY belum diset."
            exit 1
          fi

          if [ -n "$CHAT_ID" ] && [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN belum diset."
            exit 1
          fi

          echo "Topik : $TOPIK"
          echo "Model : $MODEL_PILIHAN"
          echo "Gemini API Key : [MASKED]"
          echo "Pexels API Key : [MASKED]"
          echo "Telegram Chat ID : ${CHAT_ID:-[NONE]}"
          echo "Telegram Bot Token : $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo '[MASKED]' || echo '[NONE]')"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            fonts-dejavu

      - name: Configure ImageMagick for MoviePy
        run: |
          echo "===================================="
          echo "   IMAGEMAGICK CONFIGURATION"
          echo "===================================="

          convert --version | head -n 3

          POLICY_FILES=$(find /etc/ImageMagick* -name policy.xml 2>/dev/null || true)

          if [ -z "$POLICY_FILES" ]; then
            echo "❌ policy.xml tidak ditemukan."
            exit 1
          fi

          for POLICY_FILE in $POLICY_FILES; do
            echo "Processing: $POLICY_FILE"

            sudo sed -i \
              's#<policy domain="path" rights="none" pattern="@\*"/>#<!-- MoviePy @ path restriction disabled -->#g' \
              "$POLICY_FILE"
          done

          echo ""
          echo "Remaining path policies:"

          for POLICY_FILE in $POLICY_FILES; do
            grep -n 'domain="path"' "$POLICY_FILE" || true
          done

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            "numpy<2" \
            moviepy==1.0.3 \
            pillow \
            requests \
            python-dotenv \
            google-generativeai

      - name: Verify project imports
        run: |
          python - <<'PY'
          import moviepy
          import PIL
          import requests
          import dotenv
          import google.generativeai

          print("MoviePy :", moviepy.__version__)
          print("Pillow  :", PIL.__version__)
          print("Requests: OK")
          print("Dotenv  : OK")
          print("Gemini  : OK")
          PY

      - name: Render video
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          from ai_generator import generate_naskah
          from video_engine import render_final_video

          topik = os.environ["TOPIK"]
          api_key = os.environ["API_KEY"]
          model_pilihan = os.environ["MODEL_PILIHAN"]

          print("")
          print("====================================")
          print("       MOTIVASI SARKAS RENDER")
          print("====================================")

          print("")
          print("Topik:")
          print(topik)

          print("")
          print("Model:")
          print(model_pilihan)

          # ==================================================
          # 1. GENERATE NASKAH
          # ==================================================

          print("")
          print("1. Menghubungi Gemini AI...")

          naskah_json = generate_naskah(
              topik,
              api_key=api_key,
              model_name=model_pilihan
          )

          if not isinstance(naskah_json, dict):
              raise RuntimeError(
                  "Response Gemini bukan object JSON."
              )

          if "error" in naskah_json:
              raise RuntimeError(
                  f"Gemini error: {naskah_json['error']}"
              )

          print("")
          print("✅ Naskah berhasil dibuat.")

          print("")
          print("====================================")
          print("NASKAH")
          print("====================================")

          print(
              f"Title     : "
              f"{naskah_json.get('title')}"
          )

          print(
              f"Setup 1   : "
              f"{naskah_json.get('setup_1')}"
          )

          print(
              f"Setup 2   : "
              f"{naskah_json.get('setup_2')}"
          )

          print(
              f"Punchline : "
              f"{naskah_json.get('punchline')}"
          )

          # ==================================================
          # 2. GENERATE YOUTUBE METADATA
          # ==================================================

          print("")
          print("2. Membuat metadata YouTube...")

          genai_prompt = f"""
          Kamu adalah YouTube content strategist untuk channel
          "Motivasi Sarkas".

          Buat metadata YouTube berdasarkan TOPIK dan NASKAH
          yang benar-benar digunakan untuk membuat video.

          TOPIK:
          {topik}

          NASKAH:
          Judul:
          {naskah_json.get("title", "")}

          Setup 1:
          {naskah_json.get("setup_1", "")}

          Setup 2:
          {naskah_json.get("setup_2", "")}

          Punchline:
          {naskah_json.get("punchline", "")}

          Visual Context:
          {naskah_json.get("visual_context", "")}

          Aturan:

          1. Title harus sama persis dengan title dari NASKAH.
          2. Description harus menjelaskan isi video.
          3. Description harus terasa natural dan relatable.
          4. Pertahankan karakter Motivasi Sarkas:
             - santai
             - cerdas
             - deadpan
             - sedikit sarkas
             - relatable
          5. Jangan membuat fakta yang tidak ada di naskah.
          6. Jangan membahas proses pembuatan video.
          7. Jangan memasukkan source.
          8. Jangan memasukkan URL.
          9. Hashtag harus relevan.
          10. Selalu sertakan:
              #motivasiSarkas
              #shorts
          11. Jangan memasukkan hashtag yang tidak relevan.
          12. Description jangan terlalu panjang.
          13. Jangan menggunakan markdown.
          14. Output HARUS JSON VALID.
          15. Jangan memberikan penjelasan tambahan.

          Format:

          {{
            "title": "...",
            "description": "...",
            "hashtags": [
              "#motivasiSarkas",
              "#shorts"
            ]
          }}
          """

          import google.generativeai as genai

          genai.configure(
              api_key=api_key.strip()
          )

          metadata_model = genai.GenerativeModel(
              model_pilihan
          )

          metadata_response = metadata_model.generate_content(
              genai_prompt
          )

          metadata_text = (
              getattr(
                  metadata_response,
                  "text",
                  ""
              ) or ""
          ).strip()

          if not metadata_text:
              raise RuntimeError(
                  "Gemini tidak menghasilkan metadata YouTube."
              )

          # Bersihkan markdown fence jika Gemini tetap
          # mengembalikannya.
          metadata_text = (
              metadata_text
              .replace("```json", "")
              .replace("```", "")
              .strip()
          )

          try:
              youtube_metadata = json.loads(
                  metadata_text
              )

          except json.JSONDecodeError:
              decoder = json.JSONDecoder()

              start = metadata_text.find("{")

              if start == -1:
                  raise RuntimeError(
                      "Response metadata YouTube bukan JSON valid."
                  )

              youtube_metadata, _ = (
                  decoder.raw_decode(
                      metadata_text[start:]
                  )
              )

          # ==================================================
          # 3. VALIDASI METADATA
          # ==================================================

          if not isinstance(
              youtube_metadata,
              dict
          ):
              raise RuntimeError(
                  "Metadata YouTube bukan object JSON."
              )

          required_fields = [
              "title",
              "description",
              "hashtags"
          ]

          for field in required_fields:

              if field not in youtube_metadata:
                  raise RuntimeError(
                      f"Metadata YouTube tidak memiliki field: {field}"
                  )

          # Title YouTube HARUS sama dengan title video.
          youtube_metadata["title"] = (
              naskah_json["title"]
          )

          if not isinstance(
              youtube_metadata["description"],
              str
          ):
              raise RuntimeError(
                  "Description YouTube harus berupa teks."
              )

          if not isinstance(
              youtube_metadata["hashtags"],
              list
          ):
              raise RuntimeError(
                  "Hashtags YouTube harus berupa array."
              )

          # Bersihkan hashtag.
          hashtags = []

          for hashtag in youtube_metadata["hashtags"]:

              if not isinstance(
                  hashtag,
                  str
              ):
                  continue

              hashtag = hashtag.strip()

              if not hashtag:
                  continue

              if not hashtag.startswith("#"):
                  hashtag = "#" + hashtag

              hashtags.append(
                  hashtag
              )

          # Hilangkan duplicate.
          hashtags = list(
              dict.fromkeys(
                  hashtags
              )
          )

          # Pastikan hashtag utama selalu ada.
          if "#motivasiSarkas" not in hashtags:
              hashtags.insert(
                  0,
                  "#motivasiSarkas"
              )

          if "#shorts" not in hashtags:
              hashtags.append(
                  "#shorts"
              )

          youtube_metadata["hashtags"] = hashtags

          print("")
          print("====================================")
          print("YOUTUBE METADATA")
          print("====================================")

          print(
              f"Title       : "
              f"{youtube_metadata['title']}"
          )

          print(
              f"Description : "
              f"{youtube_metadata['description']}"
          )

          print(
              f"Hashtags    : "
              f"{youtube_metadata['hashtags']}"
          )

          # ==================================================
          # 4. SIMPAN METADATA
          # ==================================================

          os.makedirs(
              "temp",
              exist_ok=True
          )

          youtube_metadata_path = os.path.join(
              "temp",
              "youtube.json"
          )

          with open(
              youtube_metadata_path,
              "w",
              encoding="utf-8"
          ) as metadata_file:

              json.dump(
                  youtube_metadata,
                  metadata_file,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              f"✅ youtube.json dibuat: "
              f"{youtube_metadata_path}"
          )

          # ==================================================
          # 5. SIMPAN RENDER RESULT
          # ==================================================

          result_path = os.path.join(
              "temp",
              "render_result.json"
          )

          with open(
              result_path,
              "w",
              encoding="utf-8"
          ) as result_file:

              json.dump(
                  {
                      "naskah": naskah_json
                  },
                  result_file,
                  ensure_ascii=False,
                  indent=2
              )

          # ==================================================
          # 6. RENDER VIDEO
          # ==================================================

          print("")
          print("3. Menyerahkan naskah ke Mesin Video...")

          output = render_final_video(
              naskah_json
          )

          if not output:
              raise RuntimeError(
                  "render_final_video() "
                  "mengembalikan None."
              )

          if not os.path.exists(output):
              raise RuntimeError(
                  f"File output tidak ditemukan: {output}"
              )

          file_size = os.path.getsize(
              output
          )

          print("")
          print("====================================")
          print("       VIDEO SELESAI DIBUAT")
          print("====================================")

          print(
              f"Output : {output}"
          )

          print(
              f"Size   : "
              f"{file_size / 1024 / 1024:.2f} MB"
          )

          if file_size < 1000:
              raise RuntimeError(
                  "Video output terlalu kecil."
              )

          print("")
          print("✅ RENDER BERHASIL.")

          PY

      - name: Show generated files
        run: |
          echo "===================================="
          echo "       HASIL RENDER"
          echo "===================================="

          find temp \
            -maxdepth 1 \
            -type f \
            -printf "%p - %s bytes\n"

          echo ""
          echo "MEMORY:"
          free -h

      - name: Send result to Telegram
        if: ${{ github.event.client_payload.chat_id != '' }}
        run: |
          python send_to_telegram.py

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: motivasi-sarkas-video-${{ github.run_id }}
          path: |
            temp/final_*.mp4
            temp/render_result.json
            temp/youtube.json
          if-no-files-found: error
          retention-days: 1

      - name: Render completed
        run: |
          echo ""
          echo "===================================="
          echo "       JOB SELESAI"
          echo "===================================="

name: Test Motivasi Sarkas Render

on:
  workflow_dispatch:

jobs:
  render-test:
    runs-on: ubuntu-latest

    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # RUNNER INFO
      # ==========================================
      - name: Show runner resources
        run: |
          echo "===================================="
          echo "       GITHUB RUNNER"
          echo "===================================="

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "MEMORY:"
          free -h

          echo ""
          echo "DISK:"
          df -h .

          echo ""
          echo "PYTHON:"
          python --version

      # ==========================================
      # SYSTEM DEPENDENCIES
      # ==========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            fonts-dejavu

      # ==========================================
      # IMAGEMAGICK POLICY
      # ==========================================
      - name: Configure ImageMagick for MoviePy
        run: |
          echo "===================================="
          echo "   IMAGEMAGICK CONFIGURATION"
          echo "===================================="

          echo ""
          echo "ImageMagick version:"
          convert --version | head -n 3

          echo ""
          echo "Searching policy.xml..."

          POLICY_FILES=$(find /etc/ImageMagick* -name policy.xml 2>/dev/null || true)

          if [ -z "$POLICY_FILES" ]; then
            echo "❌ policy.xml tidak ditemukan."
            exit 1
          fi

          echo "$POLICY_FILES"

          echo ""
          echo "Applying MoviePy path policy fix..."

          for POLICY_FILE in $POLICY_FILES; do
            echo "Processing: $POLICY_FILE"

            sudo sed -i \
              's#<policy domain="path" rights="none" pattern="@\*"/>#<!-- MoviePy @ path restriction disabled -->#g' \
              "$POLICY_FILE"
          done

          echo ""
          echo "Checking remaining @ path restrictions..."

          for POLICY_FILE in $POLICY_FILES; do
            echo "---- $POLICY_FILE ----"
            grep -n 'domain="path"' "$POLICY_FILE" || true
          done

          echo ""
          echo "ImageMagick policy:"
          identify -list policy

      # ==========================================
      # FFMPEG + IMAGEMAGICK
      # ==========================================
      - name: Show FFmpeg and ImageMagick
        run: |
          echo "===================================="
          echo "       FFMPEG / IMAGEMAGICK"
          echo "===================================="

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo ""
          echo "ImageMagick:"
          convert --version | head -n 2

      # ==========================================
      # PYTHON DEPENDENCIES
      # ==========================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            moviepy==1.0.3 \
            pillow \
            requests \
            python-dotenv

      # ==========================================
      # IMPORT TEST
      # ==========================================
      - name: Verify project imports
        run: |
          python - <<'PY'
          import moviepy
          import PIL
          import requests
          import dotenv

          print("MoviePy :", moviepy.__version__)
          print("Pillow  :", PIL.__version__)
          print("Requests: OK")
          print("Dotenv  : OK")
          PY

      # ==========================================
      # PEXELS SECRET
      # ==========================================
      - name: Verify Pexels secret
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "❌ PEXELS_API_KEY belum diset."
            exit 1
          fi

          echo "✅ PEXELS_API_KEY tersedia."

      # ==========================================
      # RENDER VIDEO TEST
      # ==========================================
      - name: Render test video
        run: |
          python - <<'PY'
          import os
          from video_engine import render_final_video

          naskah = {
              "title": "KERJA KERAS PASTI ADA HASILNYA",
              "setup_1": "Kerja udah kayak kuda, tapi kok gak kaya-kaya?",
              "setup_2": "Sebenarnya kerja kerasmu itu lagi menumpuk kekayaan.",
              "punchline": "Cuma bukan di rekening kamu.",
              "visual_context": "tired office worker working at a desk",
              "bg_keywords": [
                  "tired office worker",
                  "exhausted employee",
                  "office worker stress"
              ],
              "bg_keyword": "tired office worker"
          }

          print("")
          print("====================================")
          print("       MULAI TEST RENDER")
          print("====================================")

          output = render_final_video(naskah)

          print("")
          print("====================================")
          print("       HASIL TEST RENDER")
          print("====================================")

          print("Output:", output)

          if not output:
              raise RuntimeError(
                  "render_final_video() mengembalikan None."
              )

          if not os.path.exists(output):
              raise RuntimeError(
                  f"File output tidak ditemukan: {output}"
              )

          size = os.path.getsize(output)

          print(
              f"Ukuran video: "
              f"{size / 1024 / 1024:.2f} MB"
          )

          if size < 1000:
              raise RuntimeError(
                  "File video terlalu kecil."
              )

          print("✅ VIDEO BERHASIL DIBUAT.")

      # ==========================================
      # SHOW GENERATED FILES
      # ==========================================
      - name: Show generated files
        run: |
          echo "===================================="
          echo "       FILE HASIL RENDER"
          echo "===================================="

          find temp \
            -maxdepth 1 \
            -type f \
            -printf "%p - %s bytes\n"

          echo ""
          echo "MEMORY AFTER RENDER:"
          free -h

      # ==========================================
      # UPLOAD VIDEO AS ARTIFACT
      # ==========================================
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: motivasi-sarkas-test-video
          path: temp/final_*.mp4
          if-no-files-found: error
          retention-days: 1

      # ==========================================
      # DONE
      # ==========================================
      - name: Render test completed
        run: |
          echo ""
          echo "===================================="
          echo "       TEST SELESAI"
          echo "===================================="

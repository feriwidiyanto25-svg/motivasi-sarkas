name: Test Motivasi Sarkas Render

on:
  workflow_dispatch:

jobs:
  render-test:
    runs-on: ubuntu-latest

    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner resources
        run: |
          echo "===================================="
          echo "       GITHUB RUNNER"
          echo "===================================="

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "MEMORY:"
          free -h

          echo ""
          echo "DISK:"
          df -h .

          echo ""
          echo "PYTHON:"
          python --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            imagemagick

      - name: Show FFmpeg and ImageMagick
        run: |
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo ""
          echo "ImageMagick:"
          convert --version | head -n 2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            moviepy==1.0.3 \
            pillow \
            requests \
            python-dotenv

      - name: Verify project imports
        run: |
          python - <<'PY'
          import moviepy
          import PIL
          import requests
          import dotenv

          print("MoviePy :", moviepy.__version__)
          print("Pillow  :", PIL.__version__)
          print("Requests: OK")
          print("Dotenv  : OK")
          PY

      - name: Verify Pexels secret
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "❌ PEXELS_API_KEY belum diset."
            exit 1
          fi

          echo "✅ PEXELS_API_KEY tersedia."

      - name: Render test video
        run: |
          python - <<'PY'
          import os
          from video_engine import render_final_video

          naskah = {
              "title": "KERJA KERAS PASTI ADA HASILNYA",
              "setup_1": "Kerja udah kayak kuda, tapi kok gak kaya-kaya?",
              "setup_2": "Sebenarnya kerja kerasmu itu lagi menumpuk kekayaan.",
              "punchline": "Cuma bukan di rekening kamu.",
              "visual_context": "tired office worker working at a desk",
              "bg_keywords": [
                  "tired office worker",
                  "exhausted employee",
                  "office worker stress"
              ],
              "bg_keyword": "tired office worker"
          }

          print("")
          print("====================================")
          print("       MULAI TEST RENDER")
          print("====================================")

          output = render_final_video(naskah)

          print("")
          print("====================================")
          print("       HASIL TEST RENDER")
          print("====================================")

          print("Output:", output)

          if not output:
              raise RuntimeError(
                  "render_final_video() mengembalikan None."
              )

          if not os.path.exists(output):
              raise RuntimeError(
                  f"File output tidak ditemukan: {output}"
              )

          size = os.path.getsize(output)

          print(
              f"Ukuran video: "
              f"{size / 1024 / 1024:.2f} MB"
          )

          if size < 1000:
              raise RuntimeError(
                  "File video terlalu kecil."
              )

          print("✅ VIDEO BERHASIL DIBUAT.")

      - name: Show generated files
        run: |
          echo "===================================="
          echo "       FILE HASIL RENDER"
          echo "===================================="

          find temp \
            -maxdepth 1 \
            -type f \
            -printf "%p - %s bytes\n"

          echo ""
          echo "MEMORY AFTER RENDER:"
          free -h

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: motivasi-sarkas-test-video
          path: temp/final_*.mp4
          if-no-files-found: error
          retention-days: 1

      - name: Render test completed
        run: |
          echo ""
          echo "===================================="
          echo "       TEST SELESAI"
          echo "===================================="
